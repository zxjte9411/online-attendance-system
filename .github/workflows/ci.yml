name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run verify

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.115.0
      - run: supabase start
      - run: supabase db reset
      - run: supabase test db
      - run: ./scripts/test-issue-62-attendance-concurrency.sh
      - run: supabase db advisors --local --fail-on error
      - run: ./scripts/smoke-edge-function.sh
